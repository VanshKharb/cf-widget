name: Homejudge

options:
  bundleIdPrefix: com.vanshkharb
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

# Bundle IDs, App Group and Team ID all come from Config/Identity.xcconfig so
# that someone else can build this repo without editing any source file.
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # ---------------------------------------------------------------------------
  # The app. Owns the expensive scraping (up to 10k submissions) and writes the
  # result into the shared App Group so the widget never has to do it.
  # ---------------------------------------------------------------------------
  Homejudge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Assets.xcassets
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).homejudge
        PRODUCT_NAME: Homejudge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/Homejudge-Info.plist
      properties:
        CFBundleDisplayName: Homejudge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad builds must declare every orientation or Xcode warns.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Read at runtime by SharedStore, so the Swift code needs no hardcoded ID.
        AppGroupID: $(APP_GROUP)
    entitlements:
      path: Config/Homejudge.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: HomejudgeExtension

  # ---------------------------------------------------------------------------
  # The widget extension. Three widgets share one timeline provider.
  # ---------------------------------------------------------------------------
  HomejudgeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).homejudge.widget
        PRODUCT_NAME: HomejudgeExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Config/HomejudgeExtension-Info.plist
      properties:
        CFBundleDisplayName: Homejudge
        AppGroupID: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/HomejudgeExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)

schemes:
  Homejudge:
    build:
      targets:
        Homejudge: all
    run:
      config: Debug
    archive:
      config: Release
